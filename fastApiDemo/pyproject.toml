[project]
name = "fastapidemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic>=2.14.4",
]

[tool.fastapi]
entrypoint = "fastapidemo.main:app"

[project.scripts]
fastapidemo = "fastapidemo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

