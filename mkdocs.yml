site_name: Python Concepts
site_description: A comprehensive guide to Python programming, covering foundational concepts, advanced techniques, and practical applications for developers of all levels.
site_author: Nitin Chaurasia
docs_dir: docs
repo_url: https://github.com/nitinkc/PythonConcepts

theme:
  name: material
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: brown
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: brown
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Navigation
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    #    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes      # section landing pages (quiz/, sessions/)
    - navigation.path
    - navigation.top           # Back-to-top button
    - navigation.footer        # Prev/Next page links
    # navigation.instant disabled — breaks live reload (re-enable for production builds)
    # - navigation.instant.progress
    # Search
    - search.suggest
    - search.highlight
    - header.autohide
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate    # (1) style code annotations
    - content.tabs.link        # Sync tabs across page
    - content.tooltips
    # TOC
#    - toc.integrate

plugins:
  - search
  - mkdocs_quiz

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      disable_indented_code_blocks: true
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - pymdownx.arithmatex:
      generic: true
      block_tag: 'div'

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - js/mermaid-init.js
  - js/python-runner.js

extra_css:
  - css/python-runner.css

nav:
  - Home:
      - Home: "index.md"
      - Installation: "installation.md"
  - Quick Reference: "reference/python-quick-reference.md"
  - Learn Python:
      - 1. Foundations: "01-python/01_foundation_mutability_and_data_structures.md"
      - 2. Functions and Modules: "01-python/02_functions_scope_and_modules.md"
      - 3. Object-Oriented Python: "01-python/03_object_oriented_python.md"
      - 4. Pythonic Iteration: "01-python/04_scalpel_pythonic_idioms.md"
      - 5. Reliability and Testing: "01-python/05_reliability_testing_and_typing.md"
      - 6. Concurrency and Performance: "01-python/06_concurrency_and_performance.md"
      - 7. Algorithms: "01-python/07_forge_algorithms_and_interview.md"
      - 8. Jupyter GUI Widgets: "01-python/08_jupyter_widgets.md"
      - Senior Python:
          - 9. Internals and Metaprogramming: "01-python/09_internals_and_metaprogramming.md"
          - 10. Advanced Typing and APIs: "01-python/10_advanced_typing_and_api_design.md"
          - 11. Production Async: "01-python/11_production_async_and_concurrency.md"
          - 12. Production Engineering: "01-python/12_production_engineering.md"
      - Advanced Python: "01-python/advanced-python.md"
  - Fast APIs:
      - 1. Routing and Models: "02-FastAPI/01_fastapi_core_routing_and_models.md"
      - 2. Validation and Dependencies: "02-FastAPI/02_fastapi_pydantic_errors_deps.md"
      - 3. Production Patterns: "02-FastAPI/03_fastapi_async_routers_production.md"
      - cheatsheet: "02-FastAPI/cheatsheet.md"
  - Interview Preparation:
      - Rapid Guide: "interview/index.md"
      - Senior Quizzes: "interview/quizzes.md"
      - Coding Problems: "interview/code.md"

exclude_docs:
  _abbreviations.md
